# 測試檔以層級前綴分類, 納入規則採白名單
# unit- 純函式或以假抓取函數與stub驅動, 不起server亦不開瀏覽器
# api-  起本機HTTP server或實際執行curl與瀏覽器之整合測試
# 共用工具置於 test/tools/ 而不帶 .test. 中綴, 故不會被視為測試檔
spec:
  - 'test/unit-*.test.mjs'
  - 'test/api-*.test.mjs'

# 執行參數須寫在此處而非只寫在npm script:
# 只寫在script時, 直接執行mocha者會落回預設的2000ms逾時, 使api層案例(curl之--max-time、
# 瀏覽器啟動、camofox server就緒輪詢)無謂逾時, 亦即「怎麼跑」會決定「會不會過」
timeout: 60000
parallel: true

# 環境開關(皆非必要, 未設時採預設行為):
#   CI / GITHUB_ACTIONS   CI環境, 跳過佔用固定埠或需顯示器之案例
#   WFETCHWEB_SKIP_HEADED 跳過有頭瀏覽器案例
#   WFETCHWEB_TEST_CAMOFOX=1 開啟實際啟動Camofox瀏覽器之案例
# 判斷邏輯集中於 test/tools/env.mjs
